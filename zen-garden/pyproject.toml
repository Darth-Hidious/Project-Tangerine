[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "karesansui"
version = "0.1.0"
description = "In-silico twin of a desk-scale living zen garden with a built-in raking arm: layout, rake patterns, validated toolpaths, joint-space G-code, sand simulation, lantern-lit renders and water-loop sizing."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "numba>=0.59",
    "scipy>=1.11",
    "shapely>=2.0",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
karesansui = "karesansui.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
