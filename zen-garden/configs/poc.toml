# Proof-of-concept table garden: 70 x 45 cm, a fine-sand bed raked by an arm, a pumped
# stream with living moss, preserved moss on the dry ground, two lanterns.
#
# Units: mm. Origin: inner front-left corner, x to the right, y away from the viewer (who sits
# in front, at y < 0). Heights of features are above the sand surface.
# Everything here is a design proposal to be replaced by measurements once parts exist.

[tray]                   # the unit's inner footprint
width = 700.0
depth = 450.0
wall_height = 60.0
bed_depth = 25.0         # fine sand needs far less depth than gravel: grooves are ~2-4 mm

[sand]
