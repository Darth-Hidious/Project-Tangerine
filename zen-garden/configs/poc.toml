[grit]
name = "white quartz sand 0.1-0.5 mm, washed"
repose_deg = 33.0        # Phase 0: funnel-cone test (dry fine quartz sand is typically 30-35 deg)
bulk_density = 1450.0
grain_mm = 0.3
albedo = 0.60

[rake]                   # a small floating comb on the arm's wrist
n_tines = 9
pitch = 8.0
tine_width = 2.5         # 2.5 mm stainless pins
depth = 5.0
bar_margin = 2.0
bar_thickness = 8.0
skid_gap = 6.0
skid_length = 22.0
skid_width = 16.0
hang = 15.0
float_travel = 25.0
mode = "skid"

[screed]
width = 76.0
overlap = 8.0
thickness = 4.0

[gantry]                 # motion limits of whatever carries the head (here: the arm, in Cartesian terms)
rapid_speed = 100.0
rake_speed = 20.0
screed_speed = 25.0
z_speed = 15.0
a_speed = 120.0
accel = 300.0
junction_deviation = 0.02
travel_clearance = 15.0
rake_clearance = 8.0

[planner]
wall_clearance = 3.0     # from the edge of the sand
stone_clearance = 6.0
sample_step = 1.0
min_stroke = 20.0
closed_overlap = 30.0

[lighting]
ambient_lux = 150.0      # evening room light; the lanterns do the raking light
strips = []

[arm]
kind = "scara"
base = [640.0, 225.0]
base_radius = 45.0
zero_deg = 180.0         # base-yaw range centred on the sand (to the left of the base)
travel_lift = 100.0      # clears the 70 mm stone and the 90 mm lanterns

[arm.scara]
link1 = 230.0
link2 = 230.0
link_height = 175.0
lift = 110.0

[arm.articulated]
shoulder_height = 150.0
upper = 250.0
fore = 250.0
wrist_drop = 90.0

[water]
reservoir_l = 2.0
usable_fraction = 0.5
flow_lpm = 1.0
lift_mm = 80.0
tube_id_mm = 6.0
tube_len_m = 0.7

[[lanterns]]              # 90 mm tall so a 100 mm travel lift clears everything the arm can reach
name = "back-left lantern"
xy = [205.0, 418.0]
height = 90.0
light_height = 55.0
[[lanterns]]
name = "front-right lantern"
xy = [560.0, 48.0]
height = 90.0
light_height = 55.0

